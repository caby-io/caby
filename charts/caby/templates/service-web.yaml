apiVersion: v1
kind: Service
metadata:
  name: {{ include "caby.web.fullname" . }}
  labels:
    {{- include "caby.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "caby.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
